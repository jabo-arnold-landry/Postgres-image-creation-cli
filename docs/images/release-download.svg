<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Download and extract a release</title>
  <desc id="desc">A three-step illustration showing how to download the CLI release, extract it, and open a terminal in the folder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d3150"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#07111f" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1000" height="520" rx="24" fill="url(#bg)"/>
  <text x="64" y="72" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Get the CLI ready in three steps</text>
  <text x="64" y="105" fill="#a9bdd7" font-family="Segoe UI,Arial,sans-serif" font-size="16">Use the latest archive from the repository's Releases page.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="145" width="270" height="280" rx="16" fill="#fff"/>
    <rect x="365" y="145" width="270" height="280" rx="16" fill="#fff"/>
    <rect x="666" y="145" width="270" height="280" rx="16" fill="#fff"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <circle cx="104" cy="185" r="22" fill="#3b82f6"/><text x="104" y="193" fill="#fff" font-size="20" font-weight="700">1</text>
    <circle cx="405" cy="185" r="22" fill="#3b82f6"/><text x="405" y="193" fill="#fff" font-size="20" font-weight="700">2</text>
    <circle cx="706" cy="185" r="22" fill="#3b82f6"/><text x="706" y="193" fill="#fff" font-size="20" font-weight="700">3</text>
    <text x="199" y="250" fill="#14233a" font-size="22" font-weight="700">Open Releases</text>
    <text x="199" y="282" fill="#58708d" font-size="15">Choose the newest version</text>
    <path d="M170 325h58M199 302v46M185 335l14 15 14-15" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="250" fill="#14233a" font-size="22" font-weight="700">Download archive</text>
    <text x="500" y="282" fill="#58708d" font-size="15">.zip or .tar.gz</text>
    <rect x="435" y="315" width="130" height="48" rx="8" fill="#e8f1ff"/>
    <text x="500" y="346" fill="#2563c7" font-size="16" font-weight="700">Extract files</text>
    <text x="801" y="250" fill="#14233a" font-size="22" font-weight="700">Open a terminal</text>
    <text x="801" y="282" fill="#58708d" font-size="15">Inside the extracted folder</text>
    <rect x="737" y="315" width="128" height="48" rx="8" fill="#17253a"/>
    <text x="801" y="346" fill="#7ee787" font-family="Consolas,monospace" font-size="16">$ cd cli</text>
  </g>
  <path d="M337 285h20M638 285h20" stroke="#7ea2c8" stroke-width="3" stroke-linecap="round"/>
  <path d="m349 278 9 7-9 7M650 278l9 7-9 7" fill="none" stroke="#7ea2c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
