<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Run the PostgreSQL image creation CLI</title>
  <desc id="desc">A terminal illustration showing the CLI command, prompts, and Docker Compose startup command.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#07111f" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1000" height="590" rx="24" fill="#eef4fb"/>
  <text x="58" y="63" fill="#14233a" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Run it, answer the prompts, start PostgreSQL</text>
  <g filter="url(#shadow)">
    <rect x="58" y="105" width="884" height="410" rx="16" fill="#111b2b"/>
    <rect x="58" y="105" width="884" height="48" rx="16" fill="#1e2c42"/>
    <circle cx="88" cy="129" r="7" fill="#ff6b6b"/><circle cx="112" cy="129" r="7" fill="#ffd166"/><circle cx="136" cy="129" r="7" fill="#57d68d"/>
    <text x="166" y="135" fill="#a9bdd7" font-family="Segoe UI,Arial,sans-serif" font-size="15">Git Bash</text>
  </g>
  <g font-family="Consolas,monospace" font-size="20">
    <text x="91" y="199" fill="#7ee787">$ ./create-img</text>
    <text x="91" y="243" fill="#d6deeb">DataBase-name(*):</text><text x="345" y="243" fill="#f2cc60">app_db</text>
    <text x="91" y="281" fill="#d6deeb">DataBase-user(*):</text><text x="345" y="281" fill="#f2cc60">app_user</text>
    <text x="91" y="319" fill="#d6deeb">DataBase-password(*):</text><text x="385" y="319" fill="#f2cc60">••••••••</text>
    <text x="91" y="357" fill="#d6deeb">Container-name:</text><text x="280" y="357" fill="#f2cc60">app-postgres</text>
    <text x="91" y="395" fill="#d6deeb">Container-port:</text><text x="280" y="395" fill="#f2cc60">5432</text>
    <text x="91" y="433" fill="#d6deeb">Volume-name:</text><text x="250" y="433" fill="#f2cc60">app-data</text>
    <text x="91" y="483" fill="#7ee787">$ docker compose up -d</text>
  </g>
  <text x="58" y="554" fill="#58708d" font-family="Segoe UI,Arial,sans-serif" font-size="16">A docker-compose.yml file is created in the current directory.</text>
</svg>
